<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Successful | Barcode Studio Pro</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="shortcut icon" href="/favicon.ico">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 flex items-center justify-center min-h-screen p-4 font-sans text-slate-800">
    <div class="bg-white p-8 rounded-2xl shadow-xl max-w-md w-full text-center border border-slate-100">
        <div id="status-icon" class="w-16 h-16 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto mb-4">
            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
        </div>
        <h1 id="status-title" class="text-xl font-bold text-slate-900 mb-2">Payment Successful!</h1>
        <p id="status-message" class="text-slate-600 text-sm mb-6">Confirming export tokens with server...</p>
        <a href="/" class="inline-block w-full bg-slate-900 hover:bg-slate-800 text-white font-bold py-3 px-4 rounded-xl transition shadow">
            Return to Studio
        </a>
        <p class="text-[11px] text-slate-400 mt-4">Redirecting to studio in <span id="countdown">5</span> seconds...</p>
    </div>

    <script>
        async function confirmPayment() {
            const params = new URLSearchParams(window.location.search);
            const sessionId = params.get('session_id');
            const tokens = params.get('tokens');
            const authToken = localStorage.getItem('token') || localStorage.getItem('bsp_token');

            if (authToken) {
                try {
                    const res = await fetch('/api/stripe/confirm-session', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${authToken}`
                        },
                        body: JSON.stringify({
                            session_id: sessionId,
                            tokens: tokens ? parseInt(tokens) : null
                        })
                    });
                    if (res.ok) {
                        const data = await res.json();
                        document.getElementById('status-message').textContent = `Successfully credited ${data.tokens_added || 10} Barcode Export Sets! Current balance: ${data.new_token_balance} tokens.`;
                    }
                } catch (e) {
                    console.log("Session confirmation note:", e);
                }
            } else {
                document.getElementById('status-message').textContent = 'Your payment was received. Please log in to view your updated token balance.';
            }
        }

        confirmPayment();

        let seconds = 5;
        const countdownEl = document.getElementById('countdown');
        const interval = setInterval(() => {
            seconds--;
            if (countdownEl) countdownEl.textContent = seconds;
            if (seconds <= 0) {
                clearInterval(interval);
                window.location.href = '/';
            }
        }, 1000);
    </script>
</body>
</html>
