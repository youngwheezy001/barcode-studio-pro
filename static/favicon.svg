<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1D4ED8" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
  </defs>
  <!-- Background Shield -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)"/>
  
  <!-- Barcode Stripes at Top -->
  <rect x="10" y="12" width="4" height="16" rx="1" fill="#FFFFFF"/>
  <rect x="16" y="12" width="2" height="16" rx="0.5" fill="#FFFFFF"/>
  <rect x="20" y="12" width="5" height="16" rx="1" fill="#FFFFFF"/>
  <rect x="27" y="12" width="2" height="16" rx="0.5" fill="#FFFFFF"/>
  <rect x="31" y="12" width="6" height="16" rx="1" fill="#FFFFFF"/>
  <rect x="39" y="12" width="3" height="16" rx="0.5" fill="#FFFFFF"/>
  <rect x="44" y="12" width="2" height="16" rx="0.5" fill="#FFFFFF"/>
  <rect x="48" y="12" width="6" height="16" rx="1" fill="#FFFFFF"/>

  <!-- Scanning Accent Bar -->
  <rect x="8" y="31" width="48" height="2" rx="1" fill="#38BDF8"/>

  <!-- Bold Typography P417 -->
  <text x="32" y="51" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="15" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">P417</text>
</svg>
